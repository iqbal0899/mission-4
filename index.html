<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>To-Do List</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./css/style.css">
</head>
 
<body>
 
<div class="app">
  <header>
    <h1>To Do List</h1>
    <p>Stay focused and complete every task with a smile.</p>
  </header>
 
  <div class="stats">
    <div class="stat"><strong id="stat-total">0</strong> total</div>
    <div class="stat"><strong id="stat-done">0</strong> done</div>
    <div class="stat"><strong id="stat-left">0</strong> left</div>
  </div>
 
  <div class="input-row">
    <input type="text" id="task-input" placeholder="Add a new task…" maxlength="200">
    <select id="priority-input" aria-label="Priority">
      <option value="low">Low</option>
      <option value="medium" selected>Medium</option>
      <option value="high">High</option>
    </select>
    <button class="btn-add" onclick="addTask()">Add</button>
  </div>
 
  <div class="filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
    <button class="filter-btn" data-filter="active" onclick="setFilter('active', this)">Active</button>
    <button class="filter-btn" data-filter="done" onclick="setFilter('done', this)">Completed</button>
  </div>
 
  <div class="task-list" id="task-list"></div>
 
  <div class="clear-row" id="clear-row" style="display:none">
    <button class="btn-clear" onclick="clearDone()">Clear completed</button>
  </div>
</div>
<script src="./js/app.js"></script>
</body>
<footer class="footer">
    <p>© 2026 My Tasks. Stay focused and work with joy.</p>
    <p>Developed by <strong>Muhammad Iqbal</strong></p>
</footer>
</html>
